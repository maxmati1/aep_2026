<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CidadãoAtivo</title><link rel="stylesheet" href="styles.css"></head><body><nav class="navbar"><div class="container"><div class="logo">CidadãoAtivo</div><div class="nav-menu"><a href="#home" onclick="showSection('home')">Início</a><a href="#solicitacoes" onclick="showSection('solicitacoes')">Solicitações</a><a href="#dashboard" onclick="showSection('dashboard')">Dashboard</a><a href="#perfil" onclick="showSection('perfil')">Perfil</a><button onclick="logout()">Sair</button></div></div></nav><div id="auth-section" class="auth-container"><div class="auth-form"><h1>CidadãoAtivo</h1><p>Sistema de Solicitações Públicas</p><div class="tabs"><button class="tab-btn active" onclick="showTab('login')">Login</button><button class="tab-btn" onclick="showTab('registro')">Registro</button></div><form id="login-form" class="tab-content active"><input type="email" id="login-email" placeholder="E-mail" required><input type="password" id="login-senha" placeholder="Senha" required><button type="button" onclick="fazerLogin()">Entrar</button></form><form id="registro-form" class="tab-content"><input type="text" id="reg-nome" placeholder="Nome" required><input type="email" id="reg-email" placeholder="E-mail" required><input type="password" id="reg-senha" placeholder="Senha" required><input type="text" id="reg-cpf" placeholder="CPF" required><select id="reg-tipo" required><option value="">Tipo</option><option value="CIDADAO">Cidadão</option><option value="ATENDENTE">Atendente</option><option value="GESTOR">Gestor</option></select><button type="button" onclick="fazerRegistro()">Registrar</button></form></div></div><div id="main-content" class="main-content hidden"><section id="home" class="section active"><div class="container"><h2>Bem-vindo</h2><p>Sistema para registrar solicitações de serviços públicos.</p><button onclick="showSection('solicitacoes')" class="btn-primary">Nova Solicitação</button></div></section><section id="solicitacoes" class="section"><div class="container"><h2>Solicitações</h2><div class="solicitacoes-content"><div class="form-section"><h3>Criar Solicitação</h3><form id="form-solicitacao"><select id="sol-categoria" required><option>Categoria</option><option value="ILUMINACAO">Iluminação</option><option value="BURACO">Buraco</option><option value="LIMPEZA">Limpeza</option><option value="SAUDE">Saúde</option></select><textarea id="sol-descricao" placeholder="Descrição" rows="4" required></textarea><input type="text" id="sol-localizacao" placeholder="Localização" required><input type="text" id="sol-bairro" placeholder="Bairro" required><select id="sol-prioridade" required><option value="MEDIA">Média</option><option value="ALTA">Alta</option><option value="URGENTE">Urgente</option></select><label><input type="checkbox" id="sol-anonimo"> Anônimo</label><button type="button" onclick="criarSolicitacao()" class="btn-primary">Enviar</button></form></div><div class="list-section"><h3>Minhas Solicitações</h3><div id="lista-solicitacoes"></div></div></div></section><section id="dashboard" class="section"><div class="container"><h2>Dashboard</h2><div class="dashboard-grid"><div class="card"><h3>Total</h3><p class="big-number" id="total-sol">0</p></div><div class="card"><h3>Abertas</h3><p class="big-number" id="sol-abertas">0</p></div></div><div id="dashboard-sol"></div></section><section id="perfil" class="section"><div class="container"><h2>Perfil</h2><div class="perfil-card"><p><strong>Nome:</strong> <span id="perfil-nome"></span></p><p><strong>E-mail:</strong> <span id="perfil-email"></span></p></div></div></section></div><script src="app.js"></script></body></html>
